name: 0. Daily Sync & Build

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制模式：将所有合并/换行规范化后的文件重新推送到 PT 18818'
        type: boolean
        default: false
      skip_gt5u:
        description: '跳过 GT5U runClient25，直接使用缓存的 GregTech.lang'
        type: boolean
        default: false
  schedule:
    # 中国时间每天凌晨 1 点（UTC 17:00）
    - cron: '0 17 * * *'

permissions:
  actions: write
  contents: write

env:
  # PT 主站凭据（读 4964、读写 18818）
  PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
  PT_4964_ID: ${{ secrets.PARATRANZ_PROJECT_ID }}
  PT_18818_ID: ${{ secrets.PARATRANZ_DAILY_PROJECT_ID }}
  # 兼容旧命名；脚本会自动读取其中之一
  PARATRANZ_DAILY_PROJECT_ID: ${{ secrets.PARATRANZ_DAILY_PROJECT_ID }}

  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建/缓存/上游克隆目录（脚本都从这里读）
  BUILD_DIR: .build
  CACHE_DIR: .cache
  REPO_CACHE_DIR: .build/repo-cache

  # 最终 7z 输出位置
  ASSETS_PATH: .assets.local.d

jobs:
  daily:
    name: Daily Sync & Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java for GT5U
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_gt5u != true }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Headless Client Tools
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_gt5u != true }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            x11-xserver-utils \
            mesa-utils \
            libgl1-mesa-dri \
            libopenal1 \
            libxrandr2 \
            libxxf86vm1

      # .cache 里只保留少量可复用状态（fileIds、newlines 等）以及 GT5U
      # GregTech.lang 兜底缓存；PT 与上游源码每次运行都重新拉取。
      # GitHub Actions cache 以 ref 为作用域且不可覆写，故 key 显式带 branch；
      # restore 只回溯同 branch 旧日缓存。
      - name: Setup Datetime Envs
        uses: Kiwi233/Translation-of-GTNH/.github/actions/run-script@master
        with:
          script: setup-nightly-build-datetime-envs.ts

      - name: Restore Daily Cache
        id: restore-daily-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
          key: daily-${{ github.ref_name }}-${{ env.NB_LOCAL_DATE }}
          restore-keys: |
            daily-${{ github.ref_name }}-

      # GregTech.lang is needed before the rest of the pipeline can proceed.
      # Keep it in a small dedicated cache, restored independently from the
      # broader daily cache and saved immediately after the GT5U step succeeds.
      - name: Restore GregTech.lang Cache
        id: restore-gregtech-lang-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/generated-gregtech
          key: gt5u-lang-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gt5u-lang-${{ github.ref_name }}-
            gt5u-lang-

      # ========== 三源整合流水线 ==========
      - name: Generate GregTech.lang from Latest GT5U
        shell: bash
        env:
          GT5U_LANG_TIMEOUT_MS: 2400000
          GT5U_LANG_MIN_ENTRIES: 2000
          GT5U_RUN_CLIENT_TASK: runClient25
          GT5U_CLOSE_AFTER_POSTLOAD_MS: 180000
          GT5U_LANG_USE_CACHE_ONLY: ${{ inputs.skip_gt5u == true && '1' || '' }}
        run: stdbuf -oL -eL bun .github/scripts/daily/generate-gregtech-lang.ts

      - name: Save GregTech.lang Cache
        if: ${{ hashFiles('.cache/generated-gregtech/GregTech.lang') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/generated-gregtech
          key: gt5u-lang-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fetch English (A–G) + Normalize Newlines
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/fetch-en.ts

      - name: Pull Current PT 18818 State
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/pull-current-18818.ts

      - name: Pull PT 4964 + Stage Kiwi233 Extras
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/pull-zh-4964.ts

      - name: Sync ParaTranz Terms (4964 -> 18818)
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/sync-terms.ts

      - name: Merge English + PT 18818 + PT 4964 Locally
        shell: bash
        env:
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: stdbuf -oL -eL bun .github/scripts/daily/merge-final.ts

      # Pre-push snapshot: PT 18818 still holds yesterday's pushed state here,
      # so this records YESTERDAY's settled value before today's push changes it.
      - name: Settle Yesterday's Progress (pre-push)
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/build-progress.ts --settle

      - name: Push Merged Final Files to PT 18818
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/push-final.ts

      # Post-push snapshot: PT 18818 now reflects today's push, so this records
      # today's updated value and renders the SVG + README tooltip.
      - name: Update Translation Progress Chart (post-push)
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/build-progress.ts

      - name: Commit Daily Repo Updates
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- archive progress README.md)" ]; then
            echo "[commit] no archive/progress/README changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add archive progress README.md
          git commit -m "Daily: archive retired PT files and refresh progress chart"
          git push

      - name: Rebuild .lang Files and Pack 7z
        shell: bash
        run: stdbuf -oL -eL bun .github/scripts/daily/restore-and-pack.ts
        env:
          ARCHIVE_NAME: daily-${{ env.NB_LOCAL_DATE }}.7z

      # When tips are 100% translated, restore-and-pack stages the finished file at
      # .build/upstream-tips/<rel>. Publish it to a dedicated `up/master` branch that
      # is force-synced from upstream master each run, so the maintainer gets a clean
      # single-file diff to PR upstream. Nothing here touches our own master.
      #
      # A byte-cache of the last published file (persisted in the daily .cache) gates
      # the push: when our staged tips are identical to what we last published, the
      # step no-ops. That stops the daily force-push churn while upstream is unchanged,
      # and keeps any review fixes pushed onto up/master from being clobbered next run.
      - name: Publish Upstream-Ready Tips to up/master
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: Kiwi233/Translation-of-GTNH
          REL: config/Betterloadingscreen/tips/zh_CN.txt
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          # Absolute paths: we cd into the temp clone later, so relative paths break.
          SRC="${GITHUB_WORKSPACE}/.build/upstream-tips/$REL"
          # Exact bytes we last force-pushed to up/master. Lives in the daily .cache,
          # so it survives across runs and is the authority on "what WE published"
          # (independent of any review fixes a maintainer pushes onto the branch).
          CACHE_FILE="${GITHUB_WORKSPACE}/.cache/up-master/tips-last-pushed.txt"

          if [ ! -f "$SRC" ]; then
            echo "[up/master] tips not 100% translated this run; skipping"
            exit 0
          fi

          # No-op when our output is unchanged: avoids dirty history and preserves
          # review fixes on up/master. `force=true` bypasses this to re-publish.
          if [ -z "$FORCE" ] && [ -f "$CACHE_FILE" ] && cmp -s "$SRC" "$CACHE_FILE"; then
            echo "[up/master] tips unchanged since last publish; skipping push"
            exit 0
          fi

          TMP="$(mktemp -d)"
          # Force-sync up/master from upstream master (full clone avoids shallow-push rejection).
          git clone --no-tags --branch master "https://github.com/${UPSTREAM_REPO}.git" "$TMP"
          install -D "$SRC" "$TMP/$REL"
          cd "$TMP"
          if [ -z "$(git status --porcelain -- "$REL")" ]; then
            echo "[up/master] tips already match upstream; not ahead, skipping"
            # Re-seed the cache so a later eviction/cold start won't re-push.
            install -D "$SRC" "$CACHE_FILE"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B up/master
          git add "$REL"
          git commit -m "Update loading-screen tips zh_CN.txt (GTNH Daily ahead-of-upstream)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" up/master
          # Record exactly what we just published so tomorrow can no-op if unchanged.
          install -D "$SRC" "$CACHE_FILE"
          echo "[up/master] published; open a PR from ${GITHUB_REPOSITORY}:up/master -> ${UPSTREAM_REPO}:master"

      - name: Save Daily Cache
        if: steps.restore-daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
          key: daily-${{ github.ref_name }}-${{ env.NB_LOCAL_DATE }}

      - name: Prune Old Daily Caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_PREFIX: daily-${{ github.ref_name }}-
          KEEP_KEY: daily-${{ github.ref_name }}-${{ env.NB_LOCAL_DATE }}
          REPO: ${{ github.repository }}
        run: |
          stdbuf -oL -eL bun -e '
            const repo = process.env.REPO;
            const prefix = process.env.CACHE_PREFIX;
            const keepKey = process.env.KEEP_KEY;
            const token = process.env.GH_TOKEN;
            if (!repo || !prefix || !keepKey || !token)
              throw new Error("missing cache prune env");
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "gtnh-daily-cache-pruner",
            };
            const listRes = await fetch(`https://api.github.com/repos/${repo}/actions/caches?per_page=100`, { headers });
            if (!listRes.ok)
              throw new Error(`list caches failed: ${listRes.status} ${await listRes.text()}`);
            const data = await listRes.json();
            const caches = (data.actions_caches ?? [])
              .filter(cache => typeof cache.key === "string" && cache.key.startsWith(prefix))
              .sort((a, b) => {
                const ta = Date.parse(a.last_accessed_at ?? a.created_at ?? 0);
                const tb = Date.parse(b.last_accessed_at ?? b.created_at ?? 0);
                return tb - ta;
              });
            const keep = caches.find(cache => cache.key === keepKey) ?? caches[0];
            if (!keep) {
              console.log(`[daily-cache] no cache found for prefix ${prefix}`);
              process.exit(0);
            }
            console.log(`[daily-cache] keeping ${keep.key} (#${keep.id})`);
            for (const cache of caches) {
              if (cache.id === keep.id)
                continue;
              const delRes = await fetch(`https://api.github.com/repos/${repo}/actions/caches/${cache.id}`, {
                method: "DELETE",
                headers,
              });
              if (!delRes.ok)
                throw new Error(`delete cache ${cache.id} failed: ${delRes.status} ${await delRes.text()}`);
              console.log(`[daily-cache] deleted ${cache.key} (#${cache.id})`);
            }
          '

      # ========== Tag & Release ==========
      - name: Push Tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f ${{ env.NB_TAG }}
          git push --delete origin ${{ env.NB_TAG }} || true
          git push origin ${{ env.NB_TAG }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NB_TAG }}
          name: 每日构建 - ${{ env.NB_LOCAL_DATE }}
          body: |
            请阅读主页 README 以获知详细用法

            自动构建于 ${{ env.NB_LOCAL_DATE }} ${{ env.NB_LOCAL_TIME }}
          files: ${{ env.ASSETS_PATH }}/*

  cleanup-outdated-daily-builds:
    name: Cleanup Outdated Daily Builds
    needs: daily
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Datetime Envs
        uses: Kiwi233/Translation-of-GTNH/.github/actions/run-script@master
        with:
          script: setup-nightly-build-datetime-envs.ts

      - name: Cleanup Outdated Daily Builds
        uses: Kiwi233/Translation-of-GTNH/.github/actions/run-script@master
        with:
          script: cleanup-nightly-builds.ts
